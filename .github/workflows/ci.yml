name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        java: [17, 21]
        spring-boot: [3.3.7, 3.3.13]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: python3 scripts/check_build_contract.py
      - run: ./mvnw -B verify -Dspring.boot.version=${{ matrix.spring-boot }}
      - run: python3 scripts/check_test_reports.py

  database-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: quartz-test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pquartz-test"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: >-
          ./mvnw -B verify -Pintegration-tests
          '-Dco.quartz.test.mysql.url=jdbc:mysql://127.0.0.1:3306/'
          -Dco.quartz.test.mysql.user=root -Dco.quartz.test.mysql.password=quartz-test
      - run: python3 scripts/check_test_reports.py --require-cluster
      - name: Upload database test failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: database-integration-test-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
